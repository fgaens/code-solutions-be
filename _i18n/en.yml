demos:
  eyebrow: Interactive demos
  title: Try it yourself.
  description: Choose a project and explore the demo. No account needed.
  tab_label: Choose a product demo
  loading: Loading demo…
  open: Open in a new tab
  case: Read the project story
  disclaimer: The demos use synthetic demonstration data and fictional accounts, and their interfaces are in Dutch, like the applications themselves. They show how the software behaves, not real customer results.
  solarstash:
    tagline: Energy analytics
    summary: Simulate a home battery against a full year of quarter-hourly meter data and see whether the investment holds up.
    point_one: Move capacity, battery price, and tariffs, and watch savings, payback, and net present value recalculate.
    point_two: All 35,040 intervals are simulated in the browser, interval by interval, including efficiency and power limits.
    point_three: The value curve shows where a battery stops paying for itself, instead of recommending one regardless.
    frame: SolarStash battery analysis demo
  buurhuur:
    tagline: Community platform
    summary: Browse the neighbourhood catalogue and take a rental request through its full workflow, from both sides.
    point_one: Search and filter the catalogue, then switch between the grid and list views.
    point_two: Request an item from a neighbour, then accept or decline the requests that arrive for your own.
    point_three: Pause a listing to take it out of the catalogue, or publish a new one.
    frame: BuurHuur rental platform demo
  tafeltuin:
    tagline: Playful learning
    summary: Choose your multiplication tables, play a practice round, and grow the garden of animals that rewards it.
    point_one: Set the tables, round length, and time limit, then answer with the keyboard or the on-screen keypad.
    point_two: Every answer feeds accuracy, response time, and per-table progress.
    point_three: Growth points unlock animals, the same reward loop that keeps learners coming back.
    frame: Tafeltuin multiplication practice demo

projects:
  demo_cta: Open the interactive demo
  demo_note: Runs in your browser with demonstration data. The interface is in Dutch, like the application itself.
  solarstash:
    category: Energy analytics
    description: Turning electricity-consumption data into clear battery and solar investment scenarios.
    post-image-alt: SolarStash battery analysis showing projected savings, payback, negative net present value, and energy-flow comparisons.
    post-image-caption: A running battery simulation using synthetic household data. These are modelled results, not measured customer savings or guaranteed returns.
    screenshot_alt: SolarStash battery-capacity optimisation with a net-present-value curve below zero across the tested capacities.
    screenshot_caption: The optimisation view makes an unprofitable scenario explicit rather than recommending a battery regardless of the result. Synthetic demonstration data and assumptions.
  buurhuur:
    category: Community platform
    description: A neighbourhood rental-platform MVP connecting an item catalogue with owner tools and rental requests.
    post-image-alt: BuurHuur rental catalogue with search, categories, daily prices, and illustrated demo items including a drill, tent, and projector.
    post-image-caption: The real catalogue interface with fictional accounts and original demo illustrations, not live rental offers or product photographs.
    screenshot_alt: BuurHuur request-management screen showing outgoing rentals and incoming requests with accepted, cancelled, rejected, and pending statuses.
    screenshot_caption: Incoming and outgoing rental requests created through the application using fictional accounts. Pending requests can be accepted or declined by the owner.
  tafeltuin:
    category: Playful learning
    description: Multiplication practice with encouraging feedback, collectible animal rewards, and progress stored in the browser.
    post-image-alt: Tafeltuin practice setup with selectable multiplication tables, a colourful animal garden, and the next reward to unlock.
    post-image-caption: The actual Dutch-language practice screen after automated demo rounds. No real learner's history is shown.
    screenshot_alt: Tafeltuin completed-round screen showing answered questions, accuracy, response time, growth points, and three newly earned animals.
    screenshot_caption: Rewards earned through completed demonstration rounds. The displayed scores and response times are synthetic examples, not evidence of learning outcomes.

course:
  description: "Personal AI sessions without jargon: letters, paperwork, plans, staying safe and autonomous agents. One-on-one or for your group, in Dutch or English."
  hero:
    eyebrow: AI course for everyone
    title: AI for everyday life
    subtitle: From your first question to an agent that works for you on its own
    lead: Personal guidance without jargon for anyone who is curious about ChatGPT, Claude, Gemini or Copilot. You learn step by step how it helps you at home and at work, how to stay safe, and how to let an agent carry out tasks by itself.
    cta-formats: Choose your format
    cta-programme: See the programme

  recognise:
    eyebrow: Sound familiar?
    title: AI is everywhere. Getting real use out of it is another matter.
    items:
      - You tried ChatGPT once, got a vague answer and never opened it again.
      - Your children or colleagues use AI for everything, and you wonder what you are missing.
      - You do not know which answers you can trust, or what is safe to type in.
      - Everyone talks about AI agents, but you have no idea what they could do for you.

  path:
    eyebrow: How it works
    title: Three steps, at your pace.
    intro: You practise with your own questions, on your own device.
    steps:
      - name: Start
        tagline: Ask the right way
        text: You install an assistant on your smartphone or computer and learn to ask questions that get you a useful answer straight away.
      - name: Use
        tagline: Put AI to work on real chores
        text: You get help with a difficult letter, a mail, a weekly menu or a travel plan, and you learn to check the answers and protect your privacy.
      - name: Hand over
        tagline: Let it run by itself
        text: You build an agent that carries out a recurring task on its own, within the limits you set.

  audience:
    eyebrow: Who is it for
    title: For anyone who is curious.
    items:
      - name: Curious beginners of every age
        icon: home
        text: You have a smartphone or computer and use mail and the internet. That is all you need. No technical knowledge, no jargon.
      - name: Self-employed and professionals
        icon: layers
        text: You already use AI and want to hand recurring work over to an agent, without learning to program.
      - name: Associations, libraries and municipalities
        icon: network
        text: You are looking for an accessible evening about AI for your members or residents, with time to try it themselves.

  programme:
    eyebrow: Programme
    title: Five modules. You choose.
    intro: After each module you can do something new. You follow the ones you need, at your pace.
    module-label: Module
    result-label: "After this you can:"
    tools: We show ChatGPT, Claude, Gemini and Copilot side by side. The free versions are enough for the first four modules; for the module on agents, count on a paid subscription.
    modules:
      - name: Getting started
        topics:
          - "Which assistant to pick: ChatGPT, Claude, Gemini or Copilot, free or paid"
          - Installing it on your smartphone, tablet and computer
          - Asking a question so that you get a useful answer
          - Talking instead of typing, and showing a photo instead of explaining
        result: use an assistant on your own device and talk to it with ease.
      - name: Letters, mail and paperwork
        topics:
          - Having a difficult letter from the government, bank or insurer explained in plain language
          - Writing a reply, complaint or application that sounds like you
          - Having long documents summarised
          - Refreshing your cover letter and CV
        result: understand a difficult letter and answer it yourself.
      - name: Plans, learning and hobbies
        topics:
          - A trip, weekly menu or shopping list tailored to your household
          - Learning something new, or helping with homework without taking it over
          - Ideas for garden, kitchen and DIY, starting from a photo
          - Letting the assistant remember who you are, so you do not repeat yourself
        result: make a plan you will still use this week.
      - name: Safe and sensible
        topics:
          - When AI gets it wrong, and how to check an answer
          - What you had better not share, and which settings protect your privacy
          - Recognising scams, fake messages, deepfakes and cloned voices
          - "AI and children: agreements that work"
        result: judge what you can trust and what you cannot.
      - name: Autonomous agents
        topics:
          - "From question to assignment: an assistant that takes steps itself instead of only answering"
          - Writing out a recurring task as a workflow and keeping it as a reusable skill
          - Connecting the assistant to your mail, calendar and files
          - Scheduling tasks that run by themselves, within the limits you set
        result: let an agent do a recurring task for you on its own.

  formats:
    eyebrow: Formats and prices
    title: One-on-one, or with your whole group.
    intro: Every session starts from your own questions and your own device.
    vat-note: "Prices exclude 21% VAT. Including VAT: €119.79 and €393.25."
    items:
      - name: Personal session
        tagline: One-on-one
        price: "€99"
        unit: per 1.5-hour session
        features:
          - 1.5 hours one-on-one, entirely about your questions and your device
          - You choose the modules and the number of sessions
          - Place and time by arrangement
          - Also available as a gift voucher
        cta: Book a session
        subject: AI for everyday life - personal session
      - name: For your group
        tagline: For associations, libraries and municipalities
        price: "€325"
        unit: per session
        features:
          - Talk with live examples, about 2 hours
          - Participants try it themselves on their own smartphone
          - On location in Flanders, travel included
          - In Dutch or English
        cta: Request a date
        subject: AI for everyday life - group session

  faq:
    eyebrow: Frequently asked questions
    title: Good to know.
    items:
      - question: Do I need technical knowledge?
        answer: No. If you can send a mail and look something up on the internet, you can follow. That also holds for the module on agents.
      - question: What do I need?
        answer: A smartphone, tablet or computer with internet. The free versions of the assistants are enough to start; we show you how to install them. For agents, count on a paid subscription.
      - question: In which language are the sessions given?
        answer: In Dutch or English, whichever you prefer.
      - question: Is it safe to use AI?
        answer: "A full module is about safety: what you had better not share, how to check an answer and how to recognise fake messages."
      - question: Can I cancel?
        answer: Yes. You can cancel free of charge up to 14 days after booking. If a session has already taken place by then, you only pay for that session.
      - question: Can I give a session as a gift?
        answer: Yes. Send us a mail and you receive a gift voucher that you can print or forward.

  closing:
    eyebrow: Just ask
    title: Not sure if this is for you?
    text: Send us a mail and tell us what you would like AI to help you with. You get an honest answer.
    subject: AI for everyday life - question
