demos:
  eyebrow: Interactive demos
  title: Try it yourself.
  description: Choose a project and explore the demo. No account required.
  tab_label: Choose a product demo
  loading: Loading demo…
  open: Open in a new tab
  case: Read about this project
  disclaimer: The demos use synthetic demonstration data and fictional accounts, and their interfaces are in Dutch, like the applications themselves. They show how the software behaves, not real customer results.
  solarstash:
    tagline: Energy analytics
    summary: Simulate a home battery against a full year of quarter-hourly meter data and see whether the investment holds up.
    point_one: Move capacity, battery price, and tariffs, and watch savings, payback, and net present value recalculate.
    point_two: All 35,040 intervals are simulated in the browser, interval by interval, including efficiency and power limits.
    point_three: The value curve shows where a battery stops paying for itself, instead of recommending one regardless.
    frame: SolarStash battery analysis demo
  buurhuur:
    tagline: Community platform
    summary: Browse the neighbourhood catalogue and take a rental request through its full workflow, from both sides.
    point_one: Search and filter the catalogue, then switch between the grid and list views.
    point_two: Request an item from a neighbour, then accept or decline the requests that arrive for your own.
    point_three: Pause a listing to take it out of the catalogue, or publish a new one.
    frame: BuurHuur rental platform demo
  tafeltuin:
    tagline: Playful learning
    summary: Choose your multiplication tables, play a practice round, and grow the garden of animals that rewards it.
    point_one: Set the tables, round length, and time limit, then answer with the keyboard or the on-screen keypad.
    point_two: Every answer counts towards accuracy, response time, and per-table progress.
    point_three: Growth points unlock animals, the same reward loop that keeps learners coming back.
    frame: Tafeltuin multiplication practice demo

projects:
  demo_cta: Open the interactive demo
  demo_note: Runs in your browser with demonstration data. The interface is in Dutch, like the application itself.
  solarstash:
    category: Energy analytics
    description: Turning electricity-consumption data into clear battery and solar investment scenarios.
    post-image-alt: SolarStash battery analysis showing projected savings, payback, negative net present value, and energy-flow comparisons.
    post-image-caption: A running battery simulation using synthetic household data. These are modelled results, not measured customer savings or guaranteed returns.
    screenshot_alt: SolarStash battery-capacity optimisation with a net-present-value curve below zero across the tested capacities.
    screenshot_caption: The optimisation view makes an unprofitable scenario explicit rather than recommending a battery regardless of the result. Synthetic demonstration data and assumptions.
  buurhuur:
    category: Community platform
    description: A neighbourhood rental-platform MVP connecting an item catalogue with owner tools and rental requests.
    post-image-alt: BuurHuur rental catalogue with search, categories, daily prices, and illustrated demo items including a drill, tent, and projector.
    post-image-caption: The real catalogue interface with fictional accounts and original demo illustrations, not live rental offers or product photographs.
    screenshot_alt: BuurHuur request-management screen showing outgoing rentals and incoming requests with accepted, cancelled, rejected, and pending statuses.
    screenshot_caption: Incoming and outgoing rental requests created through the application using fictional accounts. Pending requests can be accepted or declined by the owner.
  tafeltuin:
    category: Playful learning
    description: Multiplication practice with encouraging feedback, collectible animal rewards, and progress stored in the browser.
    post-image-alt: Tafeltuin practice setup with selectable multiplication tables, a colourful animal garden, and the next reward to unlock.
    post-image-caption: The actual Dutch-language practice screen after automated demo rounds. No real learner's history is shown.
    screenshot_alt: Tafeltuin completed-round screen showing answered questions, accuracy, response time, growth points, and three newly earned animals.
    screenshot_caption: Rewards earned through completed demonstration rounds. The displayed scores and response times are synthetic examples, not evidence of learning outcomes.

course:
  description: "Personal AI training without jargon: writing and documents, research and planning, working safely, and autonomous agents. One-on-one or for your group, in Dutch or English."
  hero:
    eyebrow: Practical AI training
    title: AI for everyday life
    subtitle: From your first question to an agent that handles tasks independently
    lead: Personal, hands-on training in ChatGPT, Claude, Gemini and Copilot. You learn to apply AI to your own work and administration, to assess its output critically, and to delegate recurring tasks to an agent.
    cta-formats: View formats and prices
    cta-programme: View the programme

  recognise:
    eyebrow: Sound familiar?
    title: AI is widely available. Using it well takes practice.
    items:
      - You tried ChatGPT, the answer was too generic to be useful, and you did not try again.
      - People around you use AI every day, and you are unsure where it would add value for you.
      - You do not know which answers you can rely on, or which information is safe to share.
      - AI agents are widely discussed, but it is unclear what they could take over for you.

  path:
    eyebrow: How it works
    title: Three steps, at your own pace.
    intro: You work with your own questions, on your own device.
    steps:
      - name: Start
        tagline: Ask effectively
        text: You set up an assistant on your smartphone or computer and learn to phrase a request so that the first answer is usable.
      - name: Use
        tagline: Apply AI to real work
        text: You use AI to draft emails and reports, summarise long documents, prepare meetings and compare options. You learn to verify the output and protect confidential information.
      - name: Hand over
        tagline: Let it run independently
        text: You set up an agent that carries out a recurring task independently, within the limits you define.

  audience:
    eyebrow: Who is it for
    title: For anyone who wants to use AI well.
    items:
      - name: New to AI
        icon: home
        text: You use email and the internet on a smartphone or computer. No technical background is required.
      - name: Self-employed and professionals
        icon: layers
        text: You already use AI and want to delegate recurring work to an agent, without learning to program.
      - name: Associations, libraries and municipalities
        icon: network
        text: You are looking for an accessible session on AI for your members, residents or team, with time for hands-on practice.

  programme:
    eyebrow: Programme
    title: Five modules. Choose what you need.
    intro: Each module ends with a concrete skill. You follow the modules that are relevant to you, at your own pace.
    module-label: Module
    result-label: "After this module you can:"
    tools: We compare ChatGPT, Claude, Gemini and Copilot side by side. The free versions are sufficient for the first four modules; the module on agents usually requires a paid subscription.
    modules:
      - name: Getting started
        topics:
          - "Choosing an assistant: ChatGPT, Claude, Gemini or Copilot, free or paid"
          - Setting it up on your smartphone, tablet and computer
          - "Phrasing a request that produces a usable answer: context, goal and format"
          - Working with voice, photos and documents instead of text alone
        result: use an assistant on your own devices and get usable answers from it.
      - name: Writing and documents
        topics:
          - Drafting and improving emails, proposals and reports in your own style
          - Summarising long documents such as contracts, reports and terms and conditions
          - Turning meeting notes into minutes with action items
          - Translating and proofreading texts in Dutch, English and French
        result: write a clear text faster and get to the core of a long document.
      - name: Research, analysis and planning
        topics:
          - Researching a topic with source references, and comparing products, suppliers or quotes
          - "Analysing figures: from a spreadsheet or export to a clear overview"
          - Preparing a meeting, presentation or project plan
          - Saving your context and preferences, so you do not have to repeat them
        result: prepare a decision or plan based on sources you can check.
      - name: Reliability, privacy and security
        topics:
          - Why AI makes mistakes, and how to verify an answer
          - Which information you should not share, and which settings protect your privacy
          - Recognising phishing, deepfakes and cloned voices
          - Making clear agreements on AI use, at work and at home
        result: assess what you can rely on and what you cannot.
      - name: Autonomous agents
        topics:
          - "From answering to acting: how an agent plans and carries out steps itself"
          - Describing a recurring task as a workflow and saving it as a reusable skill
          - Connecting the assistant to your mail, calendar and files
          - Scheduling tasks that run automatically, within the limits and approvals you define
        result: have an agent carry out a recurring task independently.

  formats:
    eyebrow: Formats and prices
    title: One-on-one or for your group.
    intro: Each session is built around your own questions, on your own device. One module usually takes one session.
    vat-note: "Prices exclude 21% VAT. Including VAT: €119.79, €544.50 and €393.25."
    items:
      - name: Personal session
        tagline: One-on-one
        price: "€99"
        unit: per 1.5-hour session
        features:
          - 1.5 hours one-on-one, tailored to your questions and your device
          - You choose the modules and the number of sessions
          - Location and time by arrangement
          - Also available as a gift voucher
        cta: Book a session
        subject: AI for everyday life - personal session
      - name: Full programme
        tagline: One-on-one, five sessions
        price: "€450"
        unit: for 5 sessions
        features:
          - Five 1.5-hour one-on-one sessions
          - All five modules, tailored to your questions and your device
          - Planned at your own pace, location and time by arrangement
          - €45 less than five separate sessions
        cta: Book the programme
        subject: AI for everyday life - full programme
      - name: For your group
        tagline: On location
        price: "€325"
        unit: per session
        features:
          - Presentation with live demonstrations, about 2 hours
          - Participants practise on their own smartphone
          - On location in Flanders, travel included
          - In Dutch or English
        cta: Request a date
        subject: AI for everyday life - group session

  faq:
    eyebrow: Frequently asked questions
    title: Good to know.
    items:
      - question: Do I need technical knowledge?
        answer: No. If you can send an email and search the internet, you can follow every module, including the one on agents.
      - question: What do I need?
        answer: A smartphone, tablet or computer with an internet connection. The free versions of the assistants are sufficient to start, and we show you how to set them up. The module on agents usually requires a paid subscription.
      - question: In which language are the sessions given?
        answer: In Dutch or English, as you prefer.
      - question: Is it safe to use AI?
        answer: "Yes, provided you know its limits. One module is dedicated to this: which information you should not share, how to verify an answer and how to recognise fraudulent messages."
      - question: Can I cancel?
        answer: Yes. You can cancel free of charge up to 14 days after booking. If a session has already taken place by then, you pay for that session only. If you do not complete the full programme, the sessions you followed are charged at the single-session price of €99.
      - question: Can I give a session as a gift?
        answer: Yes. You can buy a gift voucher for one or more sessions. Send us an email; after payment you receive the voucher to print or forward.

  closing:
    eyebrow: Questions?
    title: Not sure whether this suits you?
    text: Tell us what you would like to use AI for. We will tell you honestly whether these sessions are the right fit.
    subject: AI for everyday life - question
