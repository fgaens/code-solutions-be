demos:
  eyebrow: Interactieve demo's
  title: Probeer het zelf.
  description: Kies een project en probeer de demo. Je hebt geen account nodig.
  tab_label: Kies een productdemo
  loading: Demo wordt geladen…
  open: Openen in een nieuw tabblad
  case: Lees het projectverhaal
  disclaimer: De demo's gebruiken synthetische demonstratiedata en fictieve accounts. Ze tonen hoe de software zich gedraagt, niet echte klantresultaten.
  solarstash:
    tagline: Energieanalyse
    summary: Simuleer een thuisbatterij op een volledig jaar kwartierdata en zie of de investering standhoudt.
    point_one: Verschuif capaciteit, batterijprijs en tarieven en zie besparing, terugverdientijd en netto contante waarde meebewegen.
    point_two: Alle 35.040 intervallen worden in je browser doorgerekend, interval per interval, inclusief rendement en vermogenslimiet.
    point_three: De waardecurve laat zien waar een batterij zichzelf niet meer terugverdient, in plaats van er hoe dan ook een aan te raden.
    frame: SolarStash batterijanalyse-demo
  buurhuur:
    tagline: Buurtplatform
    summary: Doorzoek het buurtaanbod en volg een huuraanvraag door de hele flow, vanuit beide kanten.
    point_one: Zoek en filter het aanbod en wissel tussen raster- en lijstweergave.
    point_two: Vraag een item aan bij een buur en accepteer of weiger de aanvragen die voor jouw spullen binnenkomen.
    point_three: Pauzeer een item om het uit het aanbod te halen, of plaats er een nieuw bij.
    frame: BuurHuur verhuurplatform-demo
  tafeltuin:
    tagline: Spelend leren
    summary: Kies je tafels, speel een oefenronde en laat de dierentuin groeien die het beloont.
    point_one: Stel tafels, rondelengte en tijdslimiet in en antwoord met het toetsenbord of het cijferpaneel.
    point_two: Elk antwoord telt mee voor je score, je antwoordtijd en je voortgang per tafel.
    point_three: Groeipunten ontgrendelen dieren, dezelfde beloningslus die kinderen doet terugkomen.
    frame: Tafeltuin maaltafels-demo

projects:
  demo_cta: Open de interactieve demo
  demo_note: Draait in je browser met demonstratiedata, zonder account.
  solarstash:
    category: Energieanalyse
    description: Van elektriciteitsverbruiksgegevens naar heldere investeringsscenario's voor batterijen en zonnepanelen.
    post-image-alt: Batterijanalyse in SolarStash met geraamde besparingen, terugverdientijd, negatieve netto contante waarde en vergelijkingen van energiestromen.
    post-image-caption: Een werkende batterijsimulatie met synthetische huishoudgegevens. Dit zijn gemodelleerde resultaten, geen gemeten besparingen bij klanten of gegarandeerde rendementen.
    screenshot_alt: Optimalisatie van de batterijcapaciteit in SolarStash, met een curve van de netto contante waarde die voor alle geteste capaciteiten onder nul blijft.
    screenshot_caption: De optimalisatieweergave maakt een onrendabel scenario expliciet, in plaats van ongeacht het resultaat een batterij aan te bevelen. Synthetische demonstratiegegevens en aannames.
  buurhuur:
    category: Buurtplatform
    description: Een MVP van een verhuurplatform voor de buurt dat een catalogus verbindt met beheertools voor eigenaars en huuraanvragen.
    post-image-alt: Verhuurcatalogus van BuurHuur met zoekfunctie, categorieën, dagprijzen en geïllustreerde demospullen, waaronder een boormachine, tent en projector.
    post-image-caption: De echte catalogusinterface met fictieve accounts en speciaal gemaakte demo-illustraties, geen echte huuraanbiedingen of productfoto's.
    screenshot_alt: Aanvragenbeheer in BuurHuur met uitgaande huuraanvragen en inkomende aanvragen met de statussen aanvaard, geannuleerd, geweigerd en in afwachting.
    screenshot_caption: Inkomende en uitgaande huuraanvragen aangemaakt via de applicatie met fictieve accounts. Openstaande aanvragen kunnen door de eigenaar worden aanvaard of geweigerd.
  tafeltuin:
    category: Spelenderwijs leren
    description: Maaltafels oefenen met aanmoedigende feedback, dieren om te verzamelen als beloning en voortgang die in de browser wordt opgeslagen.
    post-image-alt: Oefeninstellingen van Tafeltuin met selecteerbare maaltafels, een kleurrijke tuin met dieren en de volgende vrij te spelen beloning.
    post-image-caption: Het echte Nederlandstalige oefenscherm na geautomatiseerde demorondes. Er wordt geen oefengeschiedenis van een echte leerling getoond.
    screenshot_alt: Het scherm na een voltooide ronde in Tafeltuin met beantwoorde vragen, het percentage juiste antwoorden, antwoordtijd, groeipunten en drie nieuw verdiende dieren.
    screenshot_caption: Beloningen verdiend door demonstratierondes af te werken. De getoonde scores en antwoordtijden zijn synthetische voorbeelden, geen bewijs van leerresultaten.

course:
  description: "Persoonlijke AI-sessies zonder vakjargon: brieven, papierwerk, plannen, veilig blijven en autonome agents. Eén op één of voor je groep, in het Nederlands of het Engels."
  hero:
    eyebrow: AI-cursus voor iedereen
    title: AI voor elke dag
    subtitle: Van je eerste vraag tot een agent die zelfstandig voor je werkt
    lead: Persoonlijke begeleiding zonder vakjargon voor wie nieuwsgierig is naar ChatGPT, Claude, Gemini of Copilot. Je leert stap voor stap hoe je er thuis en op het werk iets aan hebt, hoe je veilig blijft, en hoe je een agent zelfstandig taken laat uitvoeren.
    cta-formats: Kies je formule
    cta-programme: Bekijk het programma

  recognise:
    eyebrow: Herkenbaar?
    title: AI is overal. Er echt iets aan hebben is iets anders.
    items:
      - Je hebt ChatGPT één keer geprobeerd, kreeg een vaag antwoord en hebt het nooit meer geopend.
      - Je kinderen of collega's gebruiken AI voor alles, en je vraagt je af wat je mist.
      - Je weet niet welke antwoorden je kan vertrouwen, of wat je er veilig in kan typen.
      - Iedereen heeft het over AI-agents, maar je hebt geen idee wat die voor jou kunnen doen.

  path:
    eyebrow: Zo werkt het
    title: Drie stappen, op jouw tempo.
    intro: Je oefent met je eigen vragen, op je eigen toestel.
    steps:
      - name: Beginnen
        tagline: Stel je vraag goed
        text: Je installeert een assistent op je smartphone of computer en leert vragen stellen waarop je meteen een bruikbaar antwoord krijgt.
      - name: Gebruiken
        tagline: Zet AI in voor echte klusjes
        text: Je laat je helpen met een moeilijke brief, een mail, een weekmenu of een reisplan, en leert de antwoorden nakijken en je privacy beschermen.
      - name: Uit handen geven
        tagline: Laat het vanzelf lopen
        text: Je bouwt een agent die een terugkerende taak zelfstandig uitvoert, binnen de grenzen die jij bepaalt.

  audience:
    eyebrow: Voor wie
    title: Voor wie nieuwsgierig is.
    items:
      - name: Nieuwsgierige beginners van elke leeftijd
        icon: home
        text: Je hebt een smartphone of computer en gebruikt mail en internet. Meer heb je niet nodig. Geen technische kennis, geen vakjargon.
      - name: Zelfstandigen en professionals
        icon: layers
        text: Je gebruikt AI al en wil terugkerend werk uit handen geven aan een agent, zonder dat je moet leren programmeren.
      - name: Verenigingen, bibliotheken en gemeenten
        icon: network
        text: Je zoekt een toegankelijke avond over AI voor je leden of inwoners, met tijd om het zelf te proberen.

  programme:
    eyebrow: Programma
    title: Vijf modules. Jij kiest.
    intro: Na elke module kan je iets nieuws. Je volgt wat je nodig hebt, op jouw tempo.
    module-label: Module
    result-label: "Daarna kan je:"
    tools: We tonen ChatGPT, Claude, Gemini en Copilot naast elkaar. De gratis versies volstaan voor de eerste vier modules; voor de module over agents reken je best op een betalend abonnement.
    modules:
      - name: Aan de slag
        topics:
          - "Welke assistent je kiest: ChatGPT, Claude, Gemini of Copilot, gratis of betalend"
          - Installeren op je smartphone, tablet en computer
          - Een vraag zo stellen dat je een bruikbaar antwoord krijgt
          - Praten in plaats van typen, en een foto tonen in plaats van iets uit te leggen
        result: een assistent op je eigen toestel gebruiken en er vlot mee praten.
      - name: Brieven, mails en papierwerk
        topics:
          - Een moeilijke brief van overheid, bank of verzekeraar laten uitleggen in gewone taal
          - Een antwoord, klacht of aanvraag schrijven die klinkt zoals jij
          - Lange documenten laten samenvatten
          - Je sollicitatiebrief en cv opfrissen
        result: een moeilijke brief begrijpen en zelf beantwoorden.
      - name: Plannen, leren en hobby's
        topics:
          - Een reis, weekmenu of boodschappenlijst op maat van je gezin
          - Iets nieuws leren, of helpen bij huiswerk zonder het over te nemen
          - Ideeën voor tuin, keuken en klussen, vertrekkend van een foto
          - De assistent laten onthouden wie je bent, zodat je niets moet herhalen
        result: een plan maken dat je deze week nog gebruikt.
      - name: Veilig en verstandig
        topics:
          - Wanneer AI zich vergist, en hoe je een antwoord nakijkt
          - Wat je beter niet deelt, en welke instellingen je privacy beschermen
          - Oplichting, valse berichten, deepfakes en nagemaakte stemmen herkennen
          - "AI en kinderen: afspraken die werken"
        result: inschatten wat je kan vertrouwen en wat niet.
      - name: Autonome agents
        topics:
          - "Van vraag naar opdracht: een assistent die zelf stappen zet in plaats van alleen te antwoorden"
          - Een terugkerende taak uitschrijven als workflow en bewaren als herbruikbare skill
          - De assistent koppelen aan je mail, agenda en bestanden
          - Taken inplannen die vanzelf lopen, binnen de grenzen die jij bepaalt
        result: een agent zelfstandig een terugkerende taak voor je laten doen.

  formats:
    eyebrow: Formules en prijzen
    title: Eén op één, of met je hele groep.
    intro: Elke sessie vertrekt van je eigen vragen en je eigen toestel.
    vat-note: "Prijzen exclusief 21% btw. Inclusief btw: € 119,79 en € 393,25."
    items:
      - name: Persoonlijke sessie
        tagline: Eén op één
        price: "€ 99"
        unit: per sessie van 1,5 uur
        features:
          - 1,5 uur één op één, volledig rond jouw vragen en jouw toestel
          - Je kiest zelf de modules en het aantal sessies
          - Plaats en tijdstip in overleg
          - Ook als cadeaubon
        cta: Boek een sessie
        subject: AI voor elke dag - persoonlijke sessie
      - name: Voor je groep
        tagline: Voor verenigingen, bibliotheken en gemeenten
        price: "€ 325"
        unit: per sessie
        features:
          - Voordracht met live voorbeelden, ongeveer 2 uur
          - Deelnemers proberen het zelf op hun eigen smartphone
          - Op locatie in Vlaanderen, verplaatsing inbegrepen
          - In het Nederlands of het Engels
        cta: Vraag een datum
        subject: AI voor elke dag - groepssessie

  faq:
    eyebrow: Veelgestelde vragen
    title: Goed om te weten.
    items:
      - question: Heb ik technische kennis nodig?
        answer: Nee. Als je een mail kan sturen en iets kan opzoeken op het internet, kan je volgen. Dat geldt ook voor de module over agents.
      - question: Wat heb ik nodig?
        answer: Een smartphone, tablet of computer met internet. De gratis versies van de assistenten volstaan om te starten; we tonen hoe je ze installeert. Voor agents reken je best op een betalend abonnement.
      - question: In welke taal worden de sessies gegeven?
        answer: In het Nederlands of het Engels, wat jij verkiest.
      - question: Is het veilig om AI te gebruiken?
        answer: "Een volledige module gaat over veiligheid: wat je beter niet deelt, hoe je een antwoord nakijkt en hoe je valse berichten herkent."
      - question: Kan ik annuleren?
        answer: Ja. Je kan kosteloos annuleren tot 14 dagen na je boeking. Heeft er dan al een sessie plaatsgevonden, dan betaal je alleen die sessie.
      - question: Kan ik een sessie cadeau geven?
        answer: Ja. Stuur ons een mail en je krijgt een cadeaubon die je kan afdrukken of doorsturen.

  closing:
    eyebrow: Vraag het gerust
    title: Twijfel je of dit iets voor jou is?
    text: Stuur ons een mail en vertel waarbij AI je zou mogen helpen. Je krijgt een eerlijk antwoord.
    subject: AI voor elke dag - vraag
