demos:
  eyebrow: Interactieve demo's
  title: Probeer het zelf.
  description: Kies een project en probeer de demo. Je hebt geen account nodig.
  tab_label: Kies een productdemo
  loading: Demo wordt geladen…
  open: Openen in een nieuw tabblad
  case: Lees het projectverhaal
  disclaimer: De demo's gebruiken synthetische demonstratiedata en fictieve accounts. Ze tonen hoe de software zich gedraagt, niet echte klantresultaten.
  solarstash:
    tagline: Energieanalyse
    summary: Simuleer een thuisbatterij op een volledig jaar kwartierdata en zie of de investering standhoudt.
    point_one: Verschuif capaciteit, batterijprijs en tarieven en zie besparing, terugverdientijd en netto contante waarde meebewegen.
    point_two: Alle 35.040 intervallen worden in je browser doorgerekend, interval per interval, inclusief rendement en vermogenslimiet.
    point_three: De waardecurve laat zien waar een batterij zichzelf niet meer terugverdient, in plaats van er hoe dan ook een aan te raden.
    frame: SolarStash batterijanalyse-demo
  buurhuur:
    tagline: Buurtplatform
    summary: Doorzoek het buurtaanbod en volg een huuraanvraag door de hele flow, vanuit beide kanten.
    point_one: Zoek en filter het aanbod en wissel tussen raster- en lijstweergave.
    point_two: Vraag een item aan bij een buur en accepteer of weiger de aanvragen die voor jouw spullen binnenkomen.
    point_three: Pauzeer een item om het uit het aanbod te halen, of plaats er een nieuw bij.
    frame: BuurHuur verhuurplatform-demo
  tafeltuin:
    tagline: Spelend leren
    summary: Kies je tafels, speel een oefenronde en laat de dierentuin groeien die het beloont.
    point_one: Stel tafels, rondelengte en tijdslimiet in en antwoord met het toetsenbord of het cijferpaneel.
    point_two: Elk antwoord telt mee voor je score, je antwoordtijd en je voortgang per tafel.
    point_three: Groeipunten ontgrendelen dieren, dezelfde beloningslus die kinderen doet terugkomen.
    frame: Tafeltuin maaltafels-demo

projects:
  demo_cta: Open de interactieve demo
  demo_note: Draait in je browser met demonstratiedata, zonder account.
  solarstash:
    category: Energieanalyse
    description: Van elektriciteitsverbruiksgegevens naar heldere investeringsscenario's voor batterijen en zonnepanelen.
    post-image-alt: Batterijanalyse in SolarStash met geraamde besparingen, terugverdientijd, negatieve netto contante waarde en vergelijkingen van energiestromen.
    post-image-caption: Een werkende batterijsimulatie met synthetische huishoudgegevens. Dit zijn gemodelleerde resultaten, geen gemeten besparingen bij klanten of gegarandeerde rendementen.
    screenshot_alt: Optimalisatie van de batterijcapaciteit in SolarStash, met een curve van de netto contante waarde die voor alle geteste capaciteiten onder nul blijft.
    screenshot_caption: De optimalisatieweergave maakt een onrendabel scenario expliciet, in plaats van ongeacht het resultaat een batterij aan te bevelen. Synthetische demonstratiegegevens en aannames.
  buurhuur:
    category: Buurtplatform
    description: Een MVP van een verhuurplatform voor de buurt dat een catalogus verbindt met beheertools voor eigenaars en huuraanvragen.
    post-image-alt: Verhuurcatalogus van BuurHuur met zoekfunctie, categorieën, dagprijzen en geïllustreerde demospullen, waaronder een boormachine, tent en projector.
    post-image-caption: De echte catalogusinterface met fictieve accounts en speciaal gemaakte demo-illustraties, geen echte huuraanbiedingen of productfoto's.
    screenshot_alt: Aanvragenbeheer in BuurHuur met uitgaande huuraanvragen en inkomende aanvragen met de statussen aanvaard, geannuleerd, geweigerd en in afwachting.
    screenshot_caption: Inkomende en uitgaande huuraanvragen aangemaakt via de applicatie met fictieve accounts. Openstaande aanvragen kunnen door de eigenaar worden aanvaard of geweigerd.
  tafeltuin:
    category: Spelenderwijs leren
    description: Maaltafels oefenen met aanmoedigende feedback, dieren om te verzamelen als beloning en voortgang die in de browser wordt opgeslagen.
    post-image-alt: Oefeninstellingen van Tafeltuin met selecteerbare maaltafels, een kleurrijke tuin met dieren en de volgende vrij te spelen beloning.
    post-image-caption: Het echte Nederlandstalige oefenscherm na geautomatiseerde demorondes. Er wordt geen oefengeschiedenis van een echte leerling getoond.
    screenshot_alt: Het scherm na een voltooide ronde in Tafeltuin met beantwoorde vragen, het percentage juiste antwoorden, antwoordtijd, groeipunten en drie nieuw verdiende dieren.
    screenshot_caption: Beloningen verdiend door demonstratierondes af te werken. De getoonde scores en antwoordtijden zijn synthetische voorbeelden, geen bewijs van leerresultaten.

course:
  description: "Persoonlijke AI-opleiding zonder vakjargon: teksten en documenten, onderzoek en planning, veilig werken en autonome agents. Eén op één of voor je groep, in het Nederlands of het Engels."
  hero:
    eyebrow: Praktische AI-opleiding
    title: AI voor elke dag
    subtitle: Van je eerste vraag tot een agent die zelfstandig taken uitvoert
    lead: Persoonlijke, praktijkgerichte begeleiding in ChatGPT, Claude, Gemini en Copilot. Je leert AI toepassen op je eigen werk en administratie, de resultaten kritisch beoordelen en terugkerende taken overdragen aan een agent.
    cta-formats: Bekijk formules en prijzen
    cta-programme: Bekijk het programma

  recognise:
    eyebrow: Herkenbaar?
    title: AI is overal beschikbaar. Er goed mee werken vraagt oefening.
    items:
      - Je hebt ChatGPT uitgetest, kreeg een te algemeen antwoord en hebt het daarna niet meer geprobeerd.
      - Mensen in je omgeving gebruiken AI dagelijks, en je weet niet goed waar het voor jou een meerwaarde heeft.
      - Je weet niet op welke antwoorden je kan vertrouwen, of welke informatie je veilig kan delen.
      - Er wordt veel over AI-agents gesproken, maar het is onduidelijk wat ze voor jou kunnen overnemen.

  path:
    eyebrow: Zo werkt het
    title: Drie stappen, op jouw tempo.
    intro: Je werkt met je eigen vragen, op je eigen toestel.
    steps:
      - name: Beginnen
        tagline: Stel je vraag doeltreffend
        text: Je stelt een assistent in op je smartphone of computer en leert een vraag zo formuleren dat het eerste antwoord bruikbaar is.
      - name: Gebruiken
        tagline: Pas AI toe op echt werk
        text: Je gebruikt AI om e-mails en rapporten op te stellen, lange documenten samen te vatten, vergaderingen voor te bereiden en opties te vergelijken. Je leert de resultaten controleren en vertrouwelijke informatie beschermen.
      - name: Uit handen geven
        tagline: Laat het zelfstandig lopen
        text: Je richt een agent in die een terugkerende taak zelfstandig uitvoert, binnen de grenzen die jij bepaalt.

  audience:
    eyebrow: Voor wie
    title: Voor wie AI goed wil gebruiken.
    items:
      - name: Nieuw met AI
        icon: home
        text: Je gebruikt e-mail en internet op een smartphone of computer. Technische voorkennis is niet nodig.
      - name: Zelfstandigen en professionals
        icon: layers
        text: Je gebruikt AI al en wil terugkerend werk overdragen aan een agent, zonder te leren programmeren.
      - name: Verenigingen, bibliotheken en gemeenten
        icon: network
        text: Je zoekt een toegankelijke sessie over AI voor je leden, inwoners of team, met tijd om zelf te oefenen.

  programme:
    eyebrow: Programma
    title: Vijf modules. Kies wat je nodig hebt.
    intro: Elke module eindigt met een concrete vaardigheid. Je volgt de modules die voor jou relevant zijn, op je eigen tempo.
    module-label: Module
    result-label: "Na deze module kan je:"
    tools: We vergelijken ChatGPT, Claude, Gemini en Copilot naast elkaar. De gratis versies volstaan voor de eerste vier modules; voor de module over agents is doorgaans een betalend abonnement nodig.
    modules:
      - name: Aan de slag
        topics:
          - "Een assistent kiezen: ChatGPT, Claude, Gemini of Copilot, gratis of betalend"
          - Instellen op je smartphone, tablet en computer
          - "Een vraag formuleren die een bruikbaar antwoord oplevert: context, doel en vorm"
          - Werken met spraak, foto's en documenten in plaats van alleen tekst
        result: een assistent op je eigen toestellen gebruiken en er bruikbare antwoorden uit halen.
      - name: Teksten en documenten
        topics:
          - E-mails, offertes en rapporten opstellen en verbeteren in je eigen stijl
          - Lange documenten zoals contracten, rapporten en algemene voorwaarden samenvatten
          - Vergadernotities omzetten in een verslag met actiepunten
          - Teksten vertalen en nalezen in het Nederlands, Engels en Frans
        result: sneller een heldere tekst schrijven en de kern uit een lang document halen.
      - name: Onderzoek, analyse en planning
        topics:
          - Een onderwerp onderzoeken met bronvermelding, en producten, leveranciers of offertes vergelijken
          - "Cijfers analyseren: van een spreadsheet of export naar een helder overzicht"
          - Een vergadering, presentatie of projectplan voorbereiden
          - Je context en voorkeuren bewaren, zodat je ze niet telkens moet herhalen
        result: een beslissing of plan voorbereiden op basis van bronnen die je kan nakijken.
      - name: Betrouwbaarheid, privacy en veiligheid
        topics:
          - Waarom AI fouten maakt, en hoe je een antwoord controleert
          - Welke informatie je beter niet deelt, en welke instellingen je privacy beschermen
          - Phishing, deepfakes en nagemaakte stemmen herkennen
          - Duidelijke afspraken maken over AI-gebruik, op het werk en thuis
        result: inschatten waarop je kan vertrouwen en waarop niet.
      - name: Autonome agents
        topics:
          - "Van antwoorden naar uitvoeren: hoe een agent zelf stappen plant en uitvoert"
          - Een terugkerende taak beschrijven als workflow en bewaren als herbruikbare skill
          - De assistent koppelen aan je mail, agenda en bestanden
          - Taken inplannen die automatisch lopen, binnen de grenzen en goedkeuringen die jij bepaalt
        result: een agent een terugkerende taak zelfstandig laten uitvoeren.

  formats:
    eyebrow: Formules en prijzen
    title: Eén op één of voor je groep.
    intro: Elke sessie is opgebouwd rond je eigen vragen, op je eigen toestel. Eén module neemt doorgaans één sessie in beslag.
    vat-note: "Prijzen exclusief 21% btw. Inclusief btw: € 119,79, € 544,50 en € 393,25."
    items:
      - name: Persoonlijke sessie
        tagline: Eén op één
        price: "€ 99"
        unit: per sessie van 1,5 uur
        features:
          - 1,5 uur één op één, afgestemd op jouw vragen en jouw toestel
          - Je kiest zelf de modules en het aantal sessies
          - Plaats en tijdstip in overleg
          - Ook beschikbaar als cadeaubon
        cta: Boek een sessie
        subject: AI voor elke dag - persoonlijke sessie
      - name: Volledig programma
        tagline: Eén op één, vijf sessies
        price: "€ 450"
        unit: voor 5 sessies
        features:
          - Vijf sessies van 1,5 uur, één op één
          - Alle vijf modules, afgestemd op jouw vragen en jouw toestel
          - Gepland op jouw tempo, plaats en tijdstip in overleg
          - € 45 voordeliger dan vijf losse sessies
        cta: Boek het programma
        subject: AI voor elke dag - volledig programma
      - name: Voor je groep
        tagline: Op locatie
        price: "€ 325"
        unit: per sessie
        features:
          - Presentatie met live demonstraties, ongeveer 2 uur
          - Deelnemers oefenen op hun eigen smartphone
          - Op locatie in Vlaanderen, verplaatsing inbegrepen
          - In het Nederlands of het Engels
        cta: Vraag een datum
        subject: AI voor elke dag - groepssessie

  faq:
    eyebrow: Veelgestelde vragen
    title: Goed om te weten.
    items:
      - question: Heb ik technische kennis nodig?
        answer: Nee. Als je een e-mail kan versturen en iets kan opzoeken op het internet, kan je elke module volgen, ook die over agents.
      - question: Wat heb ik nodig?
        answer: Een smartphone, tablet of computer met internetverbinding. De gratis versies van de assistenten volstaan om te starten, en we tonen hoe je ze instelt. Voor de module over agents is doorgaans een betalend abonnement nodig.
      - question: In welke taal worden de sessies gegeven?
        answer: In het Nederlands of het Engels, naar jouw voorkeur.
      - question: Is het veilig om AI te gebruiken?
        answer: "Ja, op voorwaarde dat je de grenzen kent. Eén module is hieraan gewijd: welke informatie je beter niet deelt, hoe je een antwoord controleert en hoe je frauduleuze berichten herkent."
      - question: Kan ik annuleren?
        answer: Ja. Je kan kosteloos annuleren tot 14 dagen na je boeking. Heeft er dan al een sessie plaatsgevonden, dan betaal je alleen die sessie. Werk je het volledige programma niet af, dan betaal je de gevolgde sessies aan de prijs van een losse sessie, € 99.
      - question: Kan ik een sessie cadeau geven?
        answer: Ja. Stuur ons een e-mail en je ontvangt een cadeaubon die je kan afdrukken of doorsturen.

  closing:
    eyebrow: Vragen?
    title: Twijfel je of dit bij je past?
    text: Vertel ons waarvoor je AI wil inzetten. We zeggen je eerlijk of deze sessies daarvoor geschikt zijn.
    subject: AI voor elke dag - vraag
