demos:
  eyebrow: Interactieve demo's
  title: Probeer het zelf.
  description: Kies een project en probeer de demo. Je hebt geen account nodig.
  tab_label: Kies een productdemo
  loading: Demo wordt geladen…
  open: Openen in een nieuw tabblad
  case: Lees het projectverhaal
  disclaimer: De demo's gebruiken synthetische demonstratiedata en fictieve accounts. Ze tonen hoe de software zich gedraagt, niet echte klantresultaten.
  solarstash:
    tagline: Energieanalyse
    summary: Simuleer een thuisbatterij op een volledig jaar kwartierdata en zie of de investering standhoudt.
    point_one: Verschuif capaciteit, batterijprijs en tarieven en zie besparing, terugverdientijd en netto contante waarde meebewegen.
    point_two: Alle 35.040 intervallen worden in je browser doorgerekend, interval per interval, inclusief rendement en vermogenslimiet.
    point_three: De waardecurve laat zien waar een batterij zichzelf niet meer terugverdient, in plaats van er hoe dan ook een aan te raden.
    frame: SolarStash batterijanalyse-demo
  buurhuur:
    tagline: Buurtplatform
    summary: Doorzoek het buurtaanbod en volg een huuraanvraag door de hele flow, vanuit beide kanten.
    point_one: Zoek en filter het aanbod en wissel tussen raster- en lijstweergave.
    point_two: Vraag een item aan bij een buur en accepteer of weiger de aanvragen die voor jouw spullen binnenkomen.
    point_three: Pauzeer een item om het uit het aanbod te halen, of plaats er een nieuw bij.
    frame: BuurHuur verhuurplatform-demo
  tafeltuin:
    tagline: Spelend leren
    summary: Kies je tafels, speel een oefenronde en laat de dierentuin groeien die het beloont.
    point_one: Stel tafels, rondelengte en tijdslimiet in en antwoord met het toetsenbord of het cijferpaneel.
    point_two: Elk antwoord telt mee voor je score, je antwoordtijd en je voortgang per tafel.
    point_three: Groeipunten ontgrendelen dieren, dezelfde beloningslus die kinderen doet terugkomen.
    frame: Tafeltuin maaltafels-demo

projects:
  demo_cta: Open de interactieve demo
  demo_note: Draait in je browser met demonstratiedata, zonder account.
  solarstash:
    category: Energieanalyse
    description: Van elektriciteitsverbruiksgegevens naar heldere investeringsscenario's voor batterijen en zonnepanelen.
    post-image-alt: Batterijanalyse in SolarStash met geraamde besparingen, terugverdientijd, negatieve netto contante waarde en vergelijkingen van energiestromen.
    post-image-caption: Een werkende batterijsimulatie met synthetische huishoudgegevens. Dit zijn gemodelleerde resultaten, geen gemeten besparingen bij klanten of gegarandeerde rendementen.
    screenshot_alt: Optimalisatie van de batterijcapaciteit in SolarStash, met een curve van de netto contante waarde die voor alle geteste capaciteiten onder nul blijft.
    screenshot_caption: De optimalisatieweergave maakt een onrendabel scenario expliciet, in plaats van ongeacht het resultaat een batterij aan te bevelen. Synthetische demonstratiegegevens en aannames.
  buurhuur:
    category: Buurtplatform
    description: Een MVP van een verhuurplatform voor de buurt dat een catalogus verbindt met beheertools voor eigenaars en huuraanvragen.
    post-image-alt: Verhuurcatalogus van BuurHuur met zoekfunctie, categorieën, dagprijzen en geïllustreerde demospullen, waaronder een boormachine, tent en projector.
    post-image-caption: De echte catalogusinterface met fictieve accounts en speciaal gemaakte demo-illustraties, geen echte huuraanbiedingen of productfoto's.
    screenshot_alt: Aanvragenbeheer in BuurHuur met uitgaande huuraanvragen en inkomende aanvragen met de statussen aanvaard, geannuleerd, geweigerd en in afwachting.
    screenshot_caption: Inkomende en uitgaande huuraanvragen aangemaakt via de applicatie met fictieve accounts. Openstaande aanvragen kunnen door de eigenaar worden aanvaard of geweigerd.
  tafeltuin:
    category: Spelenderwijs leren
    description: Maaltafels oefenen met aanmoedigende feedback, dieren om te verzamelen als beloning en voortgang die in de browser wordt opgeslagen.
    post-image-alt: Oefeninstellingen van Tafeltuin met selecteerbare maaltafels, een kleurrijke tuin met dieren en de volgende vrij te spelen beloning.
    post-image-caption: Het echte Nederlandstalige oefenscherm na geautomatiseerde demorondes. Er wordt geen oefengeschiedenis van een echte leerling getoond.
    screenshot_alt: Het scherm na een voltooide ronde in Tafeltuin met beantwoorde vragen, het percentage juiste antwoorden, antwoordtijd, groeipunten en drie nieuw verdiende dieren.
    screenshot_caption: Beloningen verdiend door demonstratierondes af te werken. De getoonde scores en antwoordtijden zijn synthetische voorbeelden, geen bewijs van leerresultaten.
