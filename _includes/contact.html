<section class="contact-section section-space" id="contact" aria-labelledby="contact-title">
    <div class="container contact-grid">
        <div><p class="eyebrow">{% t home.contact_eyebrow %}</p><h2 class="section-title" id="contact-title">{% t home.contact_title %}</h2><p class="section-copy">{% t home.contact_description %}</p></div>
        <div class="contact-actions"><a class="action-link" href="mailto:{{ site.email }}">{% t home.primary_cta %}{% include icon.html name='arrow' %}</a><a class="contact-email" href="mailto:{{ site.email }}">{{ site.email }}</a></div>
    </div>
</section>
