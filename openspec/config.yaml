schema: spec-driven

context: |
  Language: en
  All artifacts must be written in en.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.
  Code Solutions is a Jekyll static website hosted on GitHub Pages, not a backend.
  Read AGENTS.md for current architecture, localization, demo, and build conventions.
  Public website copy is English and Dutch; planning documents are English.
  Shared assets must work at both the domain root and a nonempty deployment base path.
  Keep OpenSpec artifacts in this repository. Separate independent features into separate changes.

rules:
  proposal:
    - State the user-facing goal, scope, non-goals, and any hosting or privacy implications.
  specs:
    - Include English and Dutch scenarios when public copy or navigation changes.
    - Cover deployment prefixes, keyboard access, and mobile behavior when relevant.
  design:
    - Preserve static hosting; justify any new runtime or service dependency.
    - Keep authoring tools and planning artifacts excluded from Jekyll publication.
  tasks:
    - Include JEKYLL_ENV=production bundle exec jekyll build --baseurl "" as a verification task.
    - For UI or asset changes, include desktop/mobile checks in both languages and a nonempty deployment prefix.
    - Keep tasks unchecked until implementation and the corresponding verification are complete.
